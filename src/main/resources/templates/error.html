<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lỗi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  <!-- Theme dùng chung -->
<link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
  <body>
    <div class="container py-5">
      <div
        class="st-panel text-center mx-auto"
        style="max-width: 560px; margin-top: 3rem"
      >
        <span class="st-eyebrow"
          ><i class="bi bi-exclamation-triangle"></i> STORE®</span
        >
        <h1
          class="fw-bold"
          style="font-size: 4rem; color: var(--st-primary)"
          th:text="${status}"
        >
          500
        </h1>
        <p class="lead mb-1" th:text="${error}">
          Đã xảy ra lỗi, vui lòng thử lại
        </p>
        <p class="st-muted small" th:if="${path}" th:text="${path}"></p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <a class="btn btn-st-primary" th:href="@{/home}">Về trang chủ</a>
          <a class="btn btn-st-ghost" th:href="@{/product}">Xem sản phẩm</a>
        </div>
      </div>
    </div>
  </body>
</html>
