<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lỗi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container text-center py-5">
      <h1 class="display-5" th:text="${status}">500</h1>
      <p class="lead" th:text="${error}">Đã xảy ra lỗi, vui lòng thử lại</p>
      <p class="text-muted" th:if="${path}" th:text="${path}"></p>
      <a class="btn btn-dark" th:href="@{/home}">Về trang chủ</a>
    </div>
  </body>
</html>
