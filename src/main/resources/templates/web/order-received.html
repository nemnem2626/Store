<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận đã nhận hàng</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/theme.css}" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="st-panel mx-auto p-5 text-center" style="max-width: 620px;">
      <div th:if="${error}">
        <h1 class="h3 mb-3">Không xác nhận được</h1>
        <p class="text-muted" th:text="${error}"></p>
      </div>
      <div th:unless="${error}">
        <h1 class="h3 mb-3">Cảm ơn bạn!</h1>
        <p class="text-muted">
          Đơn hàng <strong th:text="'#' + ${orderId}"></strong> đã được xác nhận là
          <strong>đã nhận hàng</strong>. Chúng tôi đã gửi email xác nhận cho bạn.
        </p>
      </div>
      <a th:href="@{/home}" class="btn btn-dark rounded-pill px-4 mt-3">Về trang chủ</a>
      <a th:href="@{/orders}" class="btn btn-outline-dark rounded-pill px-4 mt-3">Đơn hàng của tôi</a>
    </div>
  </div>
</body>
</html>
