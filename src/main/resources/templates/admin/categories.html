<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý danh mục</title>
    <!-- AdminLTE & Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="#" class="brand-link">
          <span class="brand-text font-weight-light">Admin Panel</span></a
        >
        <div class="sidebar">
          <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" role="menu">
              <li class="nav-item">
                <a th:href="@{/admin/index}" class="nav-link"
                  ><i class="nav-icon fas fa-home"></i>
                  <p>Trang chủ</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/admin/products}" class="nav-link"
                  ><i class="nav-icon fas fa-box"></i>
                  <p>Quản lý sản phẩm</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/admin/variants}" class="nav-link"
                  ><i class="nav-icon fas fa-cogs"></i>
                  <p>Quản lý biến thể</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/admin/orders}" class="nav-link"
                  ><i class="nav-icon fas fa-shopping-cart"></i>
                  <p>Quản lý đơn hàng</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/admin/users}" class="nav-link"
                  ><i class="nav-icon fas fa-users"></i>
                  <p>Quản lý người dùng</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/admin/categories}" class="nav-link active"
                  ><i class="nav-icon fas fa-list"></i>
                  <p>Quản lý danh mục</p></a
                >
              </li>
              <li class="nav-item">
                <a th:href="@{/logout}" class="nav-link"
                  ><i class="nav-icon fas fa-arrow-right-from-bracket"></i>
                  <p>Đăng xuất</p></a
                >
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        <div class="container mt-4">
          <h2 class="mb-3">Quản lý danh mục</h2>

          <!-- Thông báo -->
          <div
            th:if="${success}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
            th:text="${success}"
          >
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
          <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
            th:text="${error}"
          >
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <!-- Form thêm/sửa danh mục -->
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5
                class="card-title"
                th:text="${category != null && category.id != null ? 'Chỉnh sửa danh mục' : 'Thêm danh mục mới'}"
              ></h5>
            </div>
            <div class="card-body">
              <form th:action="@{/admin/categories/save}" method="post">
                <input type="hidden" name="id" th:value="${category?.id}" />
                <div class="form-group">
                  <label for="name">Tên danh mục:</label>
                  <input
                    type="text"
                    class="form-control"
                    name="name"
                    th:value="${category?.name}"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-success"
                  th:text="${category != null && category.id != null ? 'Cập nhật' : 'Thêm danh mục'}"
                ></button>
                <a th:href="@{/admin/categories}" class="btn btn-secondary"
                  >Hủy</a
                >
              </form>
            </div>
          </div>

          <!-- Bảng danh sách danh mục -->
          <div class="card mt-4">
            <div class="card-header bg-dark text-white">
              <h5 class="card-title">Danh sách danh mục</h5>
            </div>
            <div class="card-body">
              <table class="table table-bordered table-hover">
                <thead class="thead-dark">
                  <tr>
                    <th width="10%">ID</th>
                    <th width="70%">Tên danh mục</th>
                    <th width="20%">Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td th:text="${category.name}"></td>
                    <td>
                      <a
                        th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                        class="btn btn-warning btn-sm"
                      >
                        <i class="fas fa-edit"></i> Sửa
                      </a>
                      <a
                        th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="
                          return confirm('Bạn có chắc muốn xóa danh mục này?');
                        "
                      >
                        <i class="fas fa-trash"></i> Xóa
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
